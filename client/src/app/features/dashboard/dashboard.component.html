<div class="min-h-screen px-6 py-10 max-w-4xl mx-auto bg-gradient-to-b from-[#0f1419] to-[#12151c]">
  <header class="flex items-start justify-between gap-4 mb-10">
    <div>
      <p class="text-xs font-medium tracking-[0.35em] uppercase text-amber-200/80 mb-2">SplitIt</p>
      <h1 class="text-2xl font-light text-white tracking-tight">Dashboard</h1>
      @if (auth.user(); as user) {
        <p class="text-sm font-light text-slate-400 mt-1">
          Welcome, {{ user.firstName }} {{ user.familyName }}
        </p>
      }
    </div>
    <button
      type="button"
      class="text-xs font-medium tracking-wide text-slate-400 border border-white/10 rounded-lg px-4 py-2 bg-transparent cursor-pointer transition-colors hover:text-white hover:border-white/20"
      (click)="auth.logout()"
    >
      Sign out
    </button>
  </header>

  <section class="rounded-xl border border-white/10 bg-white/[0.03] px-6 py-10 text-center text-sm font-light text-slate-500">
    <p>Your groups will appear here.</p>
  </section>
</div>
