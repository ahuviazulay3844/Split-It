<form
  class="flex flex-col gap-5"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="flex flex-col gap-1.5">
    <label for="login-email" class="text-xs font-medium tracking-wide text-slate-400 uppercase">
      דוא"ל
    </label>
    <input
      id="login-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="כתובת דוא״ל"
      class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
    />
    @if (fieldError('email')) {
      <p class="text-xs font-light text-red-400/90">{{ fieldError('email') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="login-password" class="text-xs font-medium tracking-wide text-slate-400 uppercase">
      סיסמה
    </label>
    <input
      id="login-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="הסיסמה שלך"
      class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
    />
    @if (fieldError('password')) {
      <p class="text-xs font-light text-red-400/90">{{ fieldError('password') }}</p>
    }
  </div>

  @if (errorMessage) {
    <p class="text-sm font-light text-red-300/90 rounded-lg border border-red-400/20 bg-red-500/10 px-3 py-2">
      {{ errorMessage }}
    </p>
  }

  <button
    type="submit"
    class="mt-2 w-full rounded-lg border border-amber-400/30 bg-amber-400/10 py-2.5 text-sm font-medium tracking-wide text-amber-100 cursor-pointer transition-all hover:bg-amber-400/20 hover:border-amber-400/50 disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="loadingState"
  >
    {{ loadingState ? 'מתחברים…' : 'התחברות' }}
  </button>
</form>
