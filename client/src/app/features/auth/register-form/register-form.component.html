<form
  class="flex flex-col gap-5"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="grid grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label
        for="register-firstName"
        class="text-xs font-medium tracking-wide text-slate-400 uppercase"
      >
        First name
      </label>
      <input
        id="register-firstName"
        type="text"
        formControlName="firstName"
        autocomplete="given-name"
        placeholder="Jane"
        class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
      />
      @if (fieldError('firstName')) {
        <p class="text-xs font-light text-red-400/90">{{ fieldError('firstName') }}</p>
      }
    </div>

    <div class="flex flex-col gap-1.5">
      <label
        for="register-familyName"
        class="text-xs font-medium tracking-wide text-slate-400 uppercase"
      >
        Family name
      </label>
      <input
        id="register-familyName"
        type="text"
        formControlName="familyName"
        autocomplete="family-name"
        placeholder="Doe"
        class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
      />
      @if (fieldError('familyName')) {
        <p class="text-xs font-light text-red-400/90">{{ fieldError('familyName') }}</p>
      }
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="register-email" class="text-xs font-medium tracking-wide text-slate-400 uppercase">
      Email
    </label>
    <input
      id="register-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      placeholder="you@example.com"
      class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
    />
    @if (fieldError('email')) {
      <p class="text-xs font-light text-red-400/90">{{ fieldError('email') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label
      for="register-password"
      class="text-xs font-medium tracking-wide text-slate-400 uppercase"
    >
      Password
    </label>
    <input
      id="register-password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      placeholder="At least 8 characters"
      class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
    />
    @if (fieldError('password')) {
      <p class="text-xs font-light text-red-400/90">{{ fieldError('password') }}</p>
    }
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="register-phone" class="text-xs font-medium tracking-wide text-slate-400 uppercase">
      Phone <span class="font-light opacity-60 normal-case">(optional)</span>
    </label>
    <input
      id="register-phone"
      type="tel"
      formControlName="phone"
      autocomplete="tel"
      placeholder="+1 555 000 0000"
      class="w-full rounded-lg border border-white/10 bg-white/5 px-3 py-2.5 text-sm font-light text-white placeholder:text-slate-600 outline-none transition-colors focus:border-amber-400/40 focus:bg-white/[0.07]"
    />
  </div>

  @if (errorMessage) {
    <p class="text-sm font-light text-red-300/90 rounded-lg border border-red-400/20 bg-red-500/10 px-3 py-2">
      {{ errorMessage }}
    </p>
  }

  <button
    type="submit"
    class="mt-2 w-full rounded-lg border border-amber-400/30 bg-amber-400/10 py-2.5 text-sm font-medium tracking-wide text-amber-100 cursor-pointer transition-all hover:bg-amber-400/20 hover:border-amber-400/50 disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="loadingState"
  >
    {{ loadingState ? 'Creating account…' : 'Create account' }}
  </button>
</form>
