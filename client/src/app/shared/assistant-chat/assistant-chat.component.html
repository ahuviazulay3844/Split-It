@if (auth.isAuthenticated()) {
  <div dir="rtl">
    <!-- Launcher button: always visible, docked to the bottom-left corner -->
    <button
      type="button"
      class="fixed bottom-5 left-5 z-50 flex h-14 w-14 items-center justify-center rounded-full border border-amber-400/40 bg-amber-400/15 text-2xl text-amber-100 shadow-lg shadow-black/40 backdrop-blur transition-all hover:scale-105 hover:bg-amber-400/25"
      [attr.aria-label]="open() ? 'סגירת העוזר' : 'פתיחת העוזר'"
      (click)="toggle()"
    >
      @if (open()) {
        <span aria-hidden="true">×</span>
      } @else {
        <span aria-hidden="true">✦</span>
      }
    </button>

    <!-- Side panel: fixed to the left edge, full height, never covers the page content -->
    @if (open()) {
      <aside
        class="fixed bottom-24 left-5 z-50 flex h-[70vh] max-h-[640px] w-[92vw] max-w-[380px] flex-col overflow-hidden rounded-2xl border border-white/10 bg-[#12151c] shadow-2xl shadow-black/60"
      >
        <header class="flex items-center justify-between border-b border-white/10 px-4 py-3">
          <div>
            <p class="text-xs font-medium uppercase tracking-[0.3em] text-amber-200/80">SplitIt</p>
            <h2 class="text-sm font-light text-white">עוזר חכם</h2>
          </div>
          <button
            type="button"
            class="flex h-7 w-7 items-center justify-center rounded-lg border border-white/10 text-slate-400 transition-colors hover:text-white hover:border-white/20"
            aria-label="סגירה"
            (click)="toggle()"
          >
            ×
          </button>
        </header>

        <div #scrollArea class="flex-1 space-y-3 overflow-y-auto px-4 py-4">
          @for (msg of messages(); track $index) {
            <div class="flex" [class.justify-start]="msg.role === 'assistant'" [class.justify-end]="msg.role === 'user'">
              <div
                class="max-w-[85%] whitespace-pre-wrap rounded-2xl px-3 py-2 text-sm font-light leading-relaxed"
                [class]="
                  msg.role === 'user'
                    ? 'bg-amber-400/15 text-amber-50 border border-amber-400/20'
                    : 'bg-white/[0.04] text-slate-200 border border-white/10'
                "
              >
                @if (msg.pending) {
                  <span class="inline-flex gap-1">
                    <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:-0.3s]"></span>
                    <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:-0.15s]"></span>
                    <span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400"></span>
                  </span>
                } @else {
                  {{ msg.text }}
                }
              </div>
            </div>
          }
        </div>

        @if (messages().length <= 1) {
          <div class="flex flex-wrap gap-2 px-4 pb-2">
            @for (s of suggestions; track s) {
              <button
                type="button"
                class="rounded-full border border-white/10 bg-white/[0.03] px-3 py-1 text-[11px] font-light text-slate-300 transition-colors hover:border-amber-400/30 hover:text-amber-100"
                (click)="useSuggestion(s)"
              >
                {{ s }}
              </button>
            }
          </div>
        }

        <form class="flex items-end gap-2 border-t border-white/10 p-3" (submit)="$event.preventDefault(); send()">
          <textarea
            rows="1"
            [ngModel]="input()"
            (ngModelChange)="input.set($event)"
            (keydown)="onKeydown($event)"
            name="chatInput"
            placeholder="כתבו הודעה…"
            class="max-h-28 flex-1 resize-none rounded-xl border border-white/10 bg-white/[0.03] px-3 py-2 text-sm font-light text-white placeholder:text-slate-500 focus:border-amber-400/40 focus:outline-none"
          ></textarea>
          <button
            type="submit"
            [disabled]="sending() || !input().trim()"
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-amber-400/30 bg-amber-400/15 text-amber-100 transition-all hover:bg-amber-400/25 disabled:cursor-not-allowed disabled:opacity-40"
            aria-label="שליחה"
          >
            ↑
          </button>
        </form>
      </aside>
    }
  </div>
}
